# ==============================================================================
# Mosquitto MQTT Broker Configuration
# For local communication between Ubuntu PC, Raspberry Pi CM5, and ESP32
# ==============================================================================

# Listen on default MQTT port (1883) on all network interfaces (IPv4 & IPv6)
listener 1883 0.0.0.0

# Allow unauthenticated clients on local LAN
# (Crucial: Mosquitto 2.0+ defaults to false and only listens on 127.0.0.1)
allow_anonymous true

# Logging settings for easy debugging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Optional persistence (retains messages across broker restarts)
persistence true
persistence_location /tmp/mosquitto_data/
